# MLOps 14: CI. Tests and lint on every push and pull request; on main, both images built for linux/amd64 and
# pushed to ECR as Docker v2 manifests, signed in to AWS with OIDC (no keys). Repository secrets: AWS_ROLE_ARN,
# MLOPS_ECR_REGISTRY (<account>.dkr.ecr.us-east-1.amazonaws.com).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
  id-token: write
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ccfd-project
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - run: "pip install --only-binary=:all: -r requirements-ci.txt"
      - run: ruff check .
      - run: python -m pytest -q
  images:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [serving, training]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ccfd-project
          file: ccfd-project/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=image,push=true,oci-mediatypes=false
          tags: ${{ secrets.MLOPS_ECR_REGISTRY }}/ccfd-${{ matrix.image }}:${{ steps.tag.outputs.tag }}
