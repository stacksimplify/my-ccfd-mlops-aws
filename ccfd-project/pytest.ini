# Test settings. Run from the ccfd-project folder: python -m pytest -q
# testpaths: only tests/ (the base project's p5_05_inference_test.py ends in _test.py but is a script, not a pytest test).
# pythonpath: the ccfd-project folder, so the tests can import the base project's p5_04, utils/ and m01_03_serving_api.
[pytest]
testpaths = tests
pythonpath = .
# Starlette's TestClient (starlette 0.50.0 with anyio 4.15) warns about an anyio name it uses; not our code.
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    ignore:You should not use the 'timeout' argument with the TestClient:DeprecationWarning
